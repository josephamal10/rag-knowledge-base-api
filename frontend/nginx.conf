server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (same paths the Vite dev proxy forwards).
    location ~ ^/(ask|kb|rules|health)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming answers (Server-Sent Events) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        client_max_body_size 12m;   # file uploads (frontend allows up to 10 MB)
    }

    # Single-page app: everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
